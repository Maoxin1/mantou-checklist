name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install complete Chinese fonts for visual evidence
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk

      - name: Check JavaScript syntax
        run: npm run check

      - name: Test state and backup invariants
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Test browser data reliability
        run: npm run test:browser

      - name: Test offline app and backup smoke flows
        run: npm run smoke:local

      - name: Test responsive UI and capture browser evidence
        run: npm run test:visual

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checklist-browser-evidence
          path: test-output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high


