<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6b43" />
    <meta name="description" content="个人定投清单手机编辑器" />
    <link rel="manifest" href="./editor.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=16" />
    <link rel="stylesheet" href="./editor.css?v=16" />
    <title>个人定投清单 · 手机编辑器</title>
  </head>
  <body class="mobile-editor-page">
    <header class="mobile-editor-header">
      <div>
        <span class="brand-wordmark">mantou</span>
        <h1>个人定投清单</h1>
      </div>
      <div class="mobile-header-actions">
        <button id="install-button" class="mobile-header-button" type="button" data-install-help>安装</button>
        <a href="./" aria-label="返回主页生成器">主页</a>
      </div>
    </header>

    <nav class="editor-tabs" aria-label="编辑器页面">
      <button class="editor-tab" type="button" data-editor-view="form" aria-selected="false">填写</button>
      <button class="editor-tab active" type="button" data-editor-view="preview" aria-selected="true">预览</button>
    </nav>

    <div id="connection-status" class="connection-status" role="status" aria-live="polite">
      <span aria-hidden="true"></span>
      <strong>在线</strong> · 数据仅保存到当前手机
    </div>

    <main id="mobile-editor" class="mobile-editor-shell" data-view="preview">
      <section class="mobile-form-view" aria-labelledby="mobile-form-title">
        <div class="mobile-section-heading">
          <div>
            <p class="step-label">TODAY</p>
            <h2 id="mobile-form-title">更新今日状态</h2>
          </div>
          <span id="save-status" class="save-status">已自动保存</span>
        </div>

        <form id="checklist-form" autocomplete="off">
          <fieldset>
            <legend>今天</legend>
            <label>
              <span>发布日期</span>
              <input id="date" name="date" type="date" />
            </label>
          </fieldset>

          <fieldset>
            <legend>今日积累</legend>
            <label class="switch-row">
              <span>
                <strong>今日已写日记</strong>
                <small>只公开完成状态，不公开原文</small>
              </span>
              <input id="diary-done" name="diaryDone" type="checkbox" />
            </label>
            <label>
              <span>累计有效日记天数</span>
              <input id="diary-day" name="diaryDay" type="number" min="0" step="1" inputmode="numeric" />
            </label>
            <label>
              <span>认知训练</span>
              <select id="english-status" name="englishStatus">
                <option value="今日完成">今日完成</option>
                <option value="今日未开始">今日未开始</option>
                <option value="休息日">休息日</option>
              </select>
            </label>
          </fieldset>

          <fieldset>
            <legend>本周行动</legend>
            <label>
              <span>本周健身天数</span>
              <div class="stepper">
                <button id="gym-minus" type="button" aria-label="健身天数减一">−</button>
                <input id="gym-count" name="gymCount" type="number" min="0" max="4" step="1" inputmode="numeric" />
                <button id="gym-plus" type="button" aria-label="健身天数加一">＋</button>
              </div>
            </label>
          </fieldset>

          <details>
            <summary>阶段与成果设置</summary>
            <label>
              <span>身体阶段</span>
              <input id="body-phase" name="bodyPhase" type="text" maxlength="24" />
            </label>
            <label>
              <span>阶段补充</span>
              <input id="body-meta" name="bodyMeta" type="text" maxlength="24" />
            </label>
            <label>
              <span>投资阶段</span>
              <input id="investment-phase" name="investmentPhase" type="text" maxlength="30" />
            </label>
            <label>
              <span>认知训练阶段</span>
              <input id="reading-phase" name="readingPhase" type="text" maxlength="36" />
            </label>
            <label>
              <span>交付物 1</span>
              <input id="next-result" name="nextResult" type="text" maxlength="30" />
            </label>
            <label>
              <span>验收状态 1</span>
              <select id="next-result-date" name="nextResultDate">
                <option value="待验收">待验收</option>
                <option value="已通过">已通过</option>
              </select>
            </label>
            <label>
              <span>交付物 2</span>
              <input id="next-result-2" name="nextResult2" type="text" maxlength="30" />
            </label>
            <label>
              <span>验收状态 2</span>
              <select id="next-result-date-2" name="nextResultDate2">
                <option value="待验收">待验收</option>
                <option value="已通过">已通过</option>
              </select>
            </label>
            <label>
              <span>交付物 3</span>
              <input id="next-result-3" name="nextResult3" type="text" maxlength="30" />
            </label>
            <label>
              <span>验收状态 3</span>
              <select id="next-result-date-3" name="nextResultDate3">
                <option value="待验收">待验收</option>
                <option value="已通过">已通过</option>
              </select>
            </label>
            <button id="apply-phase-defaults" class="text-button" type="button">按日期恢复身体阶段默认值</button>
          </details>

          <details>
            <summary>高级设置</summary>
            <label>
              <span>长期口号</span>
              <input id="motto" name="motto" type="text" maxlength="36" />
            </label>
          </details>

          <details>
            <summary>本地数据管理</summary>
            <p class="backup-description">备份文件只包含这张清单的公开字段，用于清理浏览器数据或更换设备前手动恢复。</p>
            <div class="backup-actions">
              <button id="export-backup" class="button backup-button" type="button">导出备份</button>
              <button id="import-backup" class="button backup-button" type="button">导入恢复</button>
            </div>
            <input id="backup-file" class="visually-hidden" type="file" accept="application/json,.json" />
          </details>
        </form>

        <p class="privacy-note">内容只保存在当前手机浏览器，不上传，也不跨设备同步。</p>
      </section>

      <section class="mobile-preview-view" aria-labelledby="mobile-preview-title">
        <div class="mobile-section-heading">
          <div>
            <p class="step-label">PREVIEW</p>
            <h2 id="mobile-preview-title">松柏档案</h2>
          </div>
          <span>1080 × 1536 PNG</span>
        </div>
        <div class="single-preview">
          <img id="preview-forest" alt="松柏档案实时预览" />
        </div>
        <p class="preview-help">返回“填写”修改任意字段，预览会自动更新。</p>
      </section>
    </main>

    <div class="mobile-download-bar">
      <button id="download-button" class="button button-primary" type="button">生成并下载 PNG</button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js?v=20"></script>
    <script type="module" src="./editor.js?v=17"></script>
  </body>
</html>
