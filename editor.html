<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf1" />
    <meta name="description" content="mantou 定投清单：手机填写、预览与离线使用" />
    <meta name="application-name" content="mantou 定投清单" />
    <meta name="apple-mobile-web-app-title" content="mantou 定投清单" />
    <link rel="manifest" href="./editor.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=21" />
    <link rel="stylesheet" href="./editor.css?v=19" />
    <title>mantou 定投清单</title>
  </head>
  <body class="mobile-editor-page">
    <header class="mobile-editor-header">
      <div>
        <img class="brand-wordmark" src="./identity/mantou-wordmark-ink.svg" alt="mantou" width="112" height="32" />
        <h1>mantou 定投清单</h1>
      </div>
      <div class="mobile-header-actions">
        <button id="install-button" class="mobile-header-button" type="button" data-install-help>安装</button>
        <a href="./" aria-label="打开 mantou 定投清单桌面版">桌面版</a>
      </div>
    </header>

    <nav class="editor-tabs" role="tablist" aria-label="编辑器页面">
      <button id="tab-form" class="editor-tab active" role="tab" type="button" data-editor-view="form" aria-controls="panel-form" aria-selected="true" tabindex="0">01 · 填写</button>
      <button id="tab-preview" class="editor-tab" role="tab" type="button" data-editor-view="preview" aria-controls="panel-preview" aria-selected="false" tabindex="-1">02 · 预览</button>
    </nav>

    <div id="connection-status" class="connection-status" role="status" aria-live="polite">
      <span aria-hidden="true"></span>
      <strong>在线</strong> · 数据仅保存到当前手机
    </div>

    <main id="mobile-editor" class="mobile-editor-shell" data-view="form">
      <p id="data-notice" class="data-notice" role="status" aria-live="polite" hidden></p>
      <section id="panel-form" class="mobile-form-view" role="tabpanel" tabindex="0" aria-labelledby="tab-form">
        <div class="mobile-section-heading">
          <div>
            <p class="step-label">每天一点，慢慢向前</p>
            <h2 id="mobile-form-title">记录今天</h2>
          </div>
          <span id="save-status" class="save-status" role="status" aria-live="polite">已自动保存</span>
        </div>

        <form id="checklist-form" autocomplete="off">
          <fieldset>
            <legend>今日更新</legend>
            <div class="reading-control">
              <div class="reading-control-head">
                <div>
                  <span class="reading-control-title">破界行动</span>
                  <small>高质量阅读与批判性思维训练</small>
                </div>
                <output id="reading-minutes-value" class="reading-value" for="reading-minutes">0 分钟</output>
              </div>
              <input id="reading-minutes" class="reading-range" name="readingMinutes" aria-label="破界行动分钟" type="range" min="0" max="180" step="5" value="0" aria-describedby="reading-target" />
              <div class="reading-marks" aria-hidden="true">
                <span>0</span><span>30</span><span>60</span><span class="target-mark">90</span><span>120</span><span>150</span><span>180</span>
              </div>
              <p id="reading-target" class="reading-target">目标 90 分钟</p>
            </div>
            <label>
              <span>今日训练</span>
              <select id="training-status" name="trainingStatus">
                <option value="力量训练">力量训练</option>
                <option value="激活">激活</option>
                <option value="恢复">恢复</option>
                <option value="未训练">未训练</option>
              </select>
            </label>
            <label class="switch-row">
              <span>
                <strong>今日已写日记</strong>
                <small>只公开完成状态</small>
              </span>
              <input id="diary-done" name="diaryDone" type="checkbox" role="switch" />
            </label>
          </fieldset>

          <details>
            <summary>阶段与成果设置</summary>
            <label>
              <span>记录与发布日期（仅本周）</span>
              <input id="date" name="date" type="date" />
            </label>
            <label>
              <span>累计有效日记天数</span>
              <input id="diary-day" name="diaryDay" type="number" min="0" step="1" inputmode="numeric" />
            </label>
            <label>
              <span>当前阶段</span>
              <input id="body-phase" name="bodyPhase" type="text" maxlength="24" />
            </label>
            <label>
              <span>阶段补充</span>
              <input id="body-meta" name="bodyMeta" type="text" maxlength="24" />
            </label>
            <label>
              <span>投资阶段</span>
              <input id="investment-phase" name="investmentPhase" type="text" maxlength="30" />
            </label>
            <label>
              <span>当前阅读</span>
              <input id="reading-phase" name="readingPhase" type="text" maxlength="36" />
            </label>
            <label>
              <span>交付物 1</span>
              <input id="next-result" name="nextResult" type="text" maxlength="30" />
            </label>
            <label>
              <span>验收状态 1</span>
              <select id="next-result-date" name="nextResultDate">
                <option value="待验收">待验收</option>
                <option value="已通过">已通过</option>
              </select>
            </label>
            <label>
              <span>交付物 2</span>
              <input id="next-result-2" name="nextResult2" type="text" maxlength="30" />
            </label>
            <label>
              <span>验收状态 2</span>
              <select id="next-result-date-2" name="nextResultDate2">
                <option value="待验收">待验收</option>
                <option value="已通过">已通过</option>
              </select>
            </label>
            <label>
              <span>交付物 3</span>
              <input id="next-result-3" name="nextResult3" type="text" maxlength="30" />
            </label>
            <label>
              <span>验收状态 3</span>
              <select id="next-result-date-3" name="nextResultDate3">
                <option value="待验收">待验收</option>
                <option value="已通过">已通过</option>
              </select>
            </label>
            <button id="apply-phase-defaults" class="text-button" type="button">恢复当前阶段默认值</button>
          </details>

          <details>
            <summary>高级设置</summary>
            <label>
              <span>长期口号</span>
              <input id="motto" name="motto" type="text" maxlength="36" />
            </label>
          </details>

          <details>
            <summary>本地数据管理</summary>
            <p class="backup-description">备份文件只包含这张清单的本地状态，用于清理浏览器数据或更换设备前手动恢复。</p>
            <div class="backup-actions">
              <button id="export-backup" class="button backup-button" type="button">导出备份</button>
              <button id="import-backup" class="button backup-button" type="button">导入恢复</button>
              <button id="export-recovery" class="button backup-button" type="button">下载导入前备份</button>
            </div>
            <input id="backup-file" class="visually-hidden" type="file" accept="application/json,.json" />
          </details>
        </form>

        <p class="privacy-note">破界行动分钟、训练状态和日记状态都只保存在当前设备。</p>
      </section>

      <section id="panel-preview" class="mobile-preview-view" role="tabpanel" tabindex="0" aria-labelledby="tab-preview">
        <div class="mobile-section-heading">
          <div>
            <p class="step-label">留下一张记录</p>
            <h2 id="mobile-preview-title">行动档案</h2>
          </div>
          <span>1080 × 1536 PNG</span>
        </div>
        <div class="single-preview">
          <img id="preview-forest" alt="行动档案实时预览" />
        </div>
        <p class="preview-help">返回“填写”更新 3 个事实，预览会自动重算本周状态。</p>
      </section>
    </main>

    <div class="mobile-download-bar">
      <p>阅读 · 训练 · 日记</p>
      <button id="download-button" class="button button-primary" type="button">生成并下载 PNG</button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js?v=27"></script>
    <script type="module" src="./editor.js?v=20"></script>
    <script type="module" src="./backup.js"></script>
  </body>
</html>
