<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf1" />
    <meta name="description" content="只更新几个事实，即可生成个人定投状态卡片" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=20" />
    <title>个人定投清单生成器</title>
  </head>
  <body>
    <a class="skip-link" href="#checklist-form">跳到今日填写</a>
    <header class="app-header">
      <a class="brand-link" href="https://mantou-blog.pages.dev/" aria-label="mantou 博客">
        <img class="brand-wordmark app-wordmark" src="./identity/mantou-wordmark-ink.svg" alt="mantou" width="144" height="40" />
      </a>
      <div class="header-actions">
        <a href="./editor">手机编辑器 ↗</a>
        <a href="https://mantou-blog.pages.dev/">回到博客 ↗</a>
        <button id="install-button" class="button button-ghost" type="button" hidden>安装到桌面</button>
      </div>
    </header>
    <div class="app-intro">
      <div>
        <p class="eyebrow">长期主义 · 每日行动</p>
        <h1>个人定投清单</h1>
        <p class="intro-copy">每天三件事，留下一点向前的证据。</p>
      </div>
      <div class="intro-companion" aria-hidden="true">
        <span>慢慢来，<br />也一直向前。</span>
        <img src="./identity/mantou-p1-walk.svg" alt="" width="45" height="82" />
      </div>
    </div>

    <main class="workspace">
      <p id="data-notice" class="data-notice" role="status" aria-live="polite" hidden></p>
      <section class="editor-panel" aria-labelledby="editor-title">
        <div class="panel-heading">
          <div>
            <p class="step-label">01 · 今日行动</p>
            <h2 id="editor-title">记录今天</h2>
          </div>
          <span id="save-status" class="save-status" role="status" aria-live="polite">已自动保存</span>
        </div>

        <form id="checklist-form" autocomplete="off">
          <fieldset>
            <legend>今日事实</legend>
            <div class="reading-control">
              <div class="reading-control-head">
                <div>
                  <span class="reading-control-title">破界行动</span>
                  <small>高质量阅读与批判性思维训练</small>
                </div>
                <output id="reading-minutes-value" class="reading-value" for="reading-minutes">0 分钟</output>
              </div>
              <input id="reading-minutes" class="reading-range" name="readingMinutes" aria-label="破界行动分钟" type="range" min="0" max="180" step="5" value="0" aria-describedby="reading-target" />
              <div class="reading-marks" aria-hidden="true">
                <span>0</span><span>30</span><span>60</span><span class="target-mark">90</span><span>120</span><span>150</span><span>180</span>
              </div>
              <p id="reading-target" class="reading-target">目标 90 分钟</p>
            </div>
            <label>
              <span>今日训练</span>
              <select id="training-status" name="trainingStatus">
                <option value="力量训练">力量训练</option>
                <option value="激活">激活</option>
                <option value="恢复">恢复</option>
                <option value="未训练">未训练</option>
              </select>
            </label>
            <label class="switch-row">
              <span>
                <strong>今日已写日记</strong>
                <small>只公开完成状态，不公开原文</small>
              </span>
              <input id="diary-done" name="diaryDone" type="checkbox" role="switch" />
            </label>
          </fieldset>

          <details>
            <summary>阶段与成果设置</summary>
            <label>
              <span>记录与发布日期（仅本周）</span>
              <input id="date" name="date" type="date" />
            </label>
            <label>
              <span>累计有效日记天数</span>
              <input id="diary-day" name="diaryDay" type="number" min="0" step="1" inputmode="numeric" />
            </label>
            <label>
              <span>当前阶段</span>
              <input id="body-phase" name="bodyPhase" type="text" maxlength="24" />
            </label>
            <label>
              <span>阶段补充</span>
              <input id="body-meta" name="bodyMeta" type="text" maxlength="24" />
            </label>
            <label>
              <span>投资阶段</span>
              <input id="investment-phase" name="investmentPhase" type="text" maxlength="30" />
            </label>
            <label>
              <span>当前阅读</span>
              <input id="reading-phase" name="readingPhase" type="text" maxlength="36" />
            </label>
            <label>
              <span>交付物 1</span>
              <input id="next-result" name="nextResult" type="text" maxlength="30" />
            </label>
            <label>
              <span>验收状态 1</span>
              <select id="next-result-date" name="nextResultDate">
                <option value="待验收">待验收</option>
                <option value="已通过">已通过</option>
              </select>
            </label>
            <label>
              <span>交付物 2</span>
              <input id="next-result-2" name="nextResult2" type="text" maxlength="30" />
            </label>
            <label>
              <span>验收状态 2</span>
              <select id="next-result-date-2" name="nextResultDate2">
                <option value="待验收">待验收</option>
                <option value="已通过">已通过</option>
              </select>
            </label>
            <label>
              <span>交付物 3</span>
              <input id="next-result-3" name="nextResult3" type="text" maxlength="30" />
            </label>
            <label>
              <span>验收状态 3</span>
              <select id="next-result-date-3" name="nextResultDate3">
                <option value="待验收">待验收</option>
                <option value="已通过">已通过</option>
              </select>
            </label>
            <button id="apply-phase-defaults" class="text-button" type="button">恢复当前阶段默认值</button>
          </details>

          <details>
            <summary>高级设置</summary>
            <label>
              <span>长期口号</span>
              <input id="motto" name="motto" type="text" maxlength="36" />
            </label>
          </details>

          <details>
            <summary>本地数据管理</summary>
            <p class="backup-description">备份文件只包含这张清单的本地状态，用于清理浏览器数据或更换设备前手动恢复。</p>
            <div class="backup-actions">
              <button id="export-backup" class="button backup-button" type="button">导出备份</button>
              <button id="import-backup" class="button backup-button" type="button">导入恢复</button>
              <button id="export-recovery" class="button backup-button" type="button">下载导入前备份</button>
            </div>
            <input id="backup-file" class="visually-hidden" type="file" accept="application/json,.json" />
          </details>
        </form>

        <div class="editor-actions">
          <button id="download-button" class="button button-primary" type="button">生成并下载 PNG</button>
        </div>
        <p class="privacy-note">自动汇总本周进度 · 数据仅保存在当前浏览器</p>
      </section>

      <section class="preview-panel" aria-labelledby="preview-title">
        <div class="panel-heading">
          <div>
            <p class="step-label">02 · 留下一张记录</p>
            <h2 id="preview-title">行动档案</h2>
          </div>
          <span>1080 × 1536 PNG</span>
        </div>

        <div class="single-preview">
          <img id="preview-forest" alt="行动档案实时预览" />
        </div>
      </section>
    </main>
    <footer class="app-footer">把时间转化为能力、资本与自主权。</footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js?v=26"></script>
    <script type="module" src="./backup.js"></script>
  </body>
</html>
